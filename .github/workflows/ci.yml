name: CI

on:
  push:
    branches:
      - main
      - "client-readiness/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run ESLint rules (excluding existing repository-wide Prettier baseline)
        run: |
          npx eslint . --rule 'prettier/prettier: off'
      - name: Validate formatting of new demo URL logic
        run: |
          npx prettier src/lib/eye/demo-url.test.ts
          npx prettier --check src/lib/eye/demo-url.ts
      - name: Build production app
        run: npm run build
