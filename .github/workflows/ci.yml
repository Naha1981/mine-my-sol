name: CI

on:
  push:
    branches:
      - main
      - "client-readiness/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = JSON.parse(require("node:fs").readFileSync("npm-audit.json", "utf8")); console.log("Audit totals:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); console.log(JSON.stringify(Object.entries(a.vulnerabilities ?? {}).map(([name, v]) => ({name, severity: v.severity, direct: v.isDirect, range: v.range, fixAvailable: v.fixAvailable, via: v.via.map(x => typeof x === "string" ? x : {title: x.title, url: x.url, range: x.range})})), null, 2))'
      - name: Block production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run unit tests
        run: npm test
      - name: Run ESLint rules (excluding existing repository-wide Prettier baseline)
        run: |
          npx eslint . --rule 'prettier/prettier: off'
      - name: Check formatting for new helper and authentication schema
        run: npx prettier --check src/lib/eye/demo-url.ts src/lib/eye/demo-url.test.ts src/lib/auth-schemas.ts src/lib/auth-schemas.test.ts
      - name: Build production app
        run: npm run build

  auth-db-migration:
    name: PostgreSQL auth migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minemysol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minemysol_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create minimal Supabase Auth fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d minemysol_test -v ON_ERROR_STOP=1 -f tests/sql/auth_bootstrap_fixture.sql
      - name: Apply secure signup trigger migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d minemysol_test -v ON_ERROR_STOP=1 -f drizzle/migrations/0005_secure_invitation_only_registration.sql
      - name: Attach Auth signup trigger
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d minemysol_test -v ON_ERROR_STOP=1 -c 'CREATE TRIGGER on_auth_user_created AFTER INSERT ON auth.users FOR EACH ROW EXECUTE FUNCTION public.handle_new_user();'
      - name: Test initial-admin bootstrap and invitation enforcement
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d minemysol_test -v ON_ERROR_STOP=1 -f tests/sql/auth_bootstrap_cases.sql
